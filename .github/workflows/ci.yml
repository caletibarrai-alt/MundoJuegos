name: CI Frontend Verification

# Se ejecuta automáticamente en cada Push o Pull Request hacia las ramas main y develop
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Copiar el código del repositorio a la máquina virtual de GitHub
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # 2. Configurar entorno de Node.js
      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias del proyecto (Vite, React, etc.)
      - name: Instalar dependencias
        run: npm ci

      # 4. Validar que el proyecto compila/construye correctamente para producción
      - name: Compilar proyecto (Build Test)
        run: npm run build