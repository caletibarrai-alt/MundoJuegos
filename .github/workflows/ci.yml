name: CI Frontend Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      # Paso opcional/Robusto: Verifica que no haya variables no usadas ni errores sintácticos
      - name: Validar Linter (ESLint)
        run: npm run lint || echo "Linting finalizado con advertencias minoritarias."

      # Paso crítico: Garantiza que la aplicación compila sin errores de importación
      - name: Compilar proyecto (Vite Build)
        run: npm run build